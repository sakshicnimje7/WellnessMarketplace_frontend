spring.application.name=wmat

# Database Configuration - Use separate environment variables
# IMPORTANT: Set these in Render Dashboard!
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# PostgreSQL Dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret Key
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# Disable DataSeeder in production
app.seeder.enabled=false

# Frontend URL for CORS (set this in Render environment)
FRONTEND_URL=${FRONTEND_URL:}
